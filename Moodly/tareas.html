<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moodly - Lista de Tareas</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body class="app-body">

    <header class="header">
        <div class="brand">
           <div class="brand">
            <a href="app.html"></a>
            <img src="imagenes/logo.png" alt="Moodly Logo" class="logo-img"> </a>
        </div>
        </div>
        <nav class="nav">
            <a href="app.html">Registro del día</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="pomodoro.html">Pomodoro</a>
            <a href="chatbot.html">Chatbot</a>
            <a href="tareas.html" class="active">Tareas</a>
        </nav>
        <div class="user-profile">
            <span id="userNameDisplayTareas">Usuario</span>
            <a href="index.html" class="logout-link">Cerrar sesión</a>
        </div>
    </header>

    <main class="app-container" style="max-width: 600px;">
        <div class="survey-card">
            <div class="tasks-header">
                <h2 class="survey-title" style="margin-bottom: 0; border: none;">Lista de tareas</h2>
                <button id="openTaskModalBtn" class="add-task-float-btn">+</button>
            </div>

            <!-- Contenedor de la lista de tareas -->
            <div id="tasksListContainer" class="tasks-list">
                <!-- Se llenan dinámicamente -->
            </div>
        </div>
    </main>

    <!-- Modal para Añadir Nueva Tarea -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeTaskModal">&times;</span>
            <h2>Añadir nueva tarea</h2>
            <p>Organiza tus entregas y pendientes académicos</p>
            
            <form id="formAddTask">
                <div class="form-group">
                    <label for="taskName">Nombre de la tarea</label>
                    <input type="text" id="taskName" placeholder="Ej. Entregar Proyecto de Física" required>
                </div>
                
                <div class="form-group">
                    <label for="taskDate">Fecha de Entrega</label>
                    <input type="text" id="taskDate" placeholder="Ej. 15 Oct" required>
                </div>

                <button type="submit" class="submit-btn">Crear tarea</button>
            </form>
        </div>
    </div>

    <footer class="footer">
        <p>Copyright &copy; 2026 - Moodly</p>
    </footer>

    <script src="js/tareas.js"></script>
</body>
</html>
