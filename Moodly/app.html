<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moodly - Registro del Día</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body class="app-body">

    <header class="header">
        <div class="brand">
            <a href="app.html"></a>
            <img src="imagenes/logo.png" alt="Moodly Logo" class="logo-img"> </a>
        </div>
        <nav class="nav">
            <a href="app.html" class="active">Registro del día</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="pomodoro.html">Pomodoro</a>
            <a href="chatbot.html">Chatbot</a>
            <a href="tareas.html">Tareas</a>
        </nav>
        <div class="user-profile">
            <span id="userNameDisplay">Usuario</span>
            <a href="index.html" class="logout-link">Cerrar sesión</a>
        </div>
    </header>

    <main class="app-container">
        <div class="welcome-card">
            <div class="welcome-text">
                <h1 id="welcomeGreeting">¡Hola! 👋</h1>
                <p>Tu bienestar también es parte de tus metas. Completa tu registro diario.</p>
            </div>
        </div>

        <section class="survey-card">
            <h2 class="survey-title">Registro del día</h2>

            <div class="survey-group">
                <label class="group-title">¿Cómo te sientes hoy?</label>
                <div class="mood-selector">
                    <button class="mood-btn" data-value="5">😄</button>
                    <button class="mood-btn" data-value="4">🙂</button>
                    <button class="mood-btn" data-value="3">😐</button>
                    <button class="mood-btn" data-value="2">🙁</button>
                    <button class="mood-btn" data-value="1">😫</button>
                </div>
            </div>

            <div class="survey-group">
                <label class="group-title">Factor principal</label>
                <div class="chip-group" id="factorGroup">
                    <button class="chip-btn" data-factor="Carga académica">📚 Carga académica</button>
                    <button class="chip-btn" data-factor="Exámenes">📝 Exámenes</button>
                    <button class="chip-btn" data-factor="Sueño/Cansancio">😴 Sueño/Cansancio</button>
                    <button class="chip-btn" data-factor="Tiempo libre">🎮 Tiempo libre</button>
                </div>
            </div>

            <div class="survey-group">
                <label class="group-title">Horas de sueño</label>
                <div class="chip-group" id="sleepGroup">
                    <button class="chip-btn" data-sleep="6">6 horas</button>
                    <button class="chip-btn" data-sleep="7">7 horas</button>
                    <button class="chip-btn" data-sleep="8">8 horas</button>
                </div>
            </div>

            <button class="primary-btn submit-survey-btn" id="saveSurveyBtn">Guardar registro del día</button>
        </section>
    </main>

    <footer class="footer">
        <p>Copyright &copy; 2026 - Moodly</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
